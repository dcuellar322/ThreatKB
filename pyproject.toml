[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["instance", "output", "app/static/lib", "config.py", "testing_config.py"]

[tool.ruff.lint]
# Enforce correctness without auto-sorting circular legacy model/route imports.
select = ["E9", "F63", "F7", "F82", "B018", "B023", "PLW0127", "W605"]
