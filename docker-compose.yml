services:
  db:
    image: mysql:26.7.0@sha256:9d48c42f8341068f199116dfccb919b607c99765b5c61e549a548a43033471a4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: threatkb
      MYSQL_USER: threatkb
      MYSQL_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_2026:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE --batch --execute='SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    image: redis:8.10.2@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
    volumes:
      - redis_2026:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
  web:
    build:
      context: .
      target: production
    ports:
      - "127.0.0.1:${WEB_PORT:-5080}:5000"
    environment: &app_environment
      THREATKB_DATABASE_HOST: db
      THREATKB_DATABASE_USER: threatkb
      THREATKB_DATABASE_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD}
      THREATKB_DATABASE_NAME: threatkb
      THREATKB_INSTANCE_PATH: /opt/threatkb/instance
      THREATKB_SECRET_KEY: ${THREATKB_SECRET_KEY:?Set THREATKB_SECRET_KEY}
      REDIS_BROKER_URL: redis://redis:6379/0
      THREATKB_ADMIN_EMAIL: ${THREATKB_ADMIN_EMAIL:-}
      THREATKB_ADMIN_PASSWORD: ${THREATKB_ADMIN_PASSWORD:-}
    volumes:
      - workspace:/opt/threatkb/instance
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
  scheduler:
    build:
      context: .
      target: production
    environment:
      <<: *app_environment
      THREATKB_ROLE: scheduler
    healthcheck:
      disable: true
    volumes:
      - workspace:/opt/threatkb/instance
    depends_on:
      web:
        condition: service_healthy
  worker:
    build:
      context: .
      target: production
    environment:
      <<: *app_environment
      THREATKB_ROLE: worker
    healthcheck:
      disable: true
    volumes:
      - workspace:/opt/threatkb/instance
    depends_on:
      web:
        condition: service_healthy
volumes:
  mysql_2026:
  redis_2026:
  workspace:
