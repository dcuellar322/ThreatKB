services:
  db:
    image: mysql:26.7.0@sha256:893418c8a7a34c60d2d961cc30ef136095da141478562ed2101ae3f5faba9c3f
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: threatkb
      MYSQL_USER: threatkb
      MYSQL_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_2026:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin -u root ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
  web:
    build: .
    ports:
      - "127.0.0.1:5080:5000"
    environment: &app_environment
      THREATKB_DATABASE_URL: mysql+pymysql://threatkb:${SQL_PASSWORD}@db:3306/threatkb?charset=utf8mb4
      THREATKB_SECRET_KEY: ${THREATKB_SECRET_KEY:?Set THREATKB_SECRET_KEY}
      REDIS_BROKER_URL: redis://redis:6379/0
      THREATKB_ADMIN_EMAIL: ${THREATKB_ADMIN_EMAIL:-}
      THREATKB_ADMIN_PASSWORD: ${THREATKB_ADMIN_PASSWORD:-}
    volumes:
      - workspace:/opt/threatkb/instance
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
  scheduler:
    build: .
    entrypoint: ["celery", "-A", "app.celery", "beat", "--schedule", "/tmp/threatkb-schedule", "--loglevel=info"]
    environment: *app_environment
    volumes:
      - workspace:/opt/threatkb/instance
    depends_on:
      web:
        condition: service_healthy
  worker:
    build: .
    environment:
      <<: *app_environment
      RUN_AGENT: "1"
    volumes:
      - workspace:/opt/threatkb/instance
    depends_on:
      web:
        condition: service_healthy
volumes:
  mysql_2026:
  workspace:
